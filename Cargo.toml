[package]
name = "nogml"
version = "0.1.0"
edition = "2024"
description = "AI-first headless Rust email server with MCP, Gmail REST API v1, IMAP4rev1, Resend, and upstream Gmail sync"
license = "MIT OR Apache-2.0"

[dependencies]
# Async runtime & HTTP server
axum = { version = "0.8", features = ["macros", "multipart"] }
bytes = "1"
futures-util = "0.3"
http = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }

# Serialization & HTTP client
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Embedded SQLite persistence (behind pluggable MailStore trait)
r2d2 = "0.8"
r2d2_sqlite = { version = "0.37", features = ["bundled"] }
rusqlite = { version = "0.42", features = ["bundled"] }

# MIME parsing/building, encoding & webhook verification
base64 = "0.22"
hmac = "0.12"
mail-builder = "2"
mail-parser = "1"
sha2 = "0.10"
subtle = "2"

# TLS & upstream IMAP client
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

# CLI, config, errors, logging & time
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
wiremock = "0.6"
